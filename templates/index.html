<!DOCTYPE html>
<html lang="en" class="explorer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ChessTB Explorer</title>

  <!-- Inline SVG favicon - no extra file needed -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23c89b3c'/%3E%3Ctext x='12' y='17' text-anchor='middle' font-family='system-ui,sans-serif' font-size='13' font-weight='700' fill='%230e0d0c'%3E%E2%99%9F%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pieces-cburnett.css') }}" id="chesstb-piece-css">
</head>
<body>

<!-- Mounts the React app (see frontend/src). github_url is passed through
     this data attribute because the Content-Security-Policy has no
     'unsafe-inline' for script-src. -->

<script type="module" src="{{ url_for('static', filename='dist/app.js') }}"></script>

</body>
</html>
